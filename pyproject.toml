[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]

[project]
name = "assert-one-assert-per-test"
description = "CLI tool to assert that each test function, in any supported language, contains exactly one assertion"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "10U Labs", email = "dev@10ulabs.com" }]
readme = "README.md"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-rust>=0.24",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dynamic = ["version"]

[project.scripts]
assert-one-assert-per-test = "assert_one_assert_per_test.cli:main"

[project.urls]
Homepage = "https://github.com/10U-Labs/assert-one-assert-per-test"
Repository = "https://github.com/10U-Labs/assert-one-assert-per-test"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]
